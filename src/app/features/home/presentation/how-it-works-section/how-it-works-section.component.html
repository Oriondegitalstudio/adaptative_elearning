<section class="how-section">
  <luna-container width="default">
    <div class="how-header">
      <luna-badge variant="primary">
        <span>HOW IT WORKS</span>
      </luna-badge>
      <h2 class="how-title">Four small steps. Endless discoveries.</h2>
    </div>

    <div class="how-steps-grid">
      @for (step of steps; track step.number) {
        <div class="how-step">
          <div class="how-number">{{ step.number }}</div>
          <h3 class="how-step-title">{{ step.title }}</h3>
          <p class="how-step-desc">{{ step.description }}</p>
        </div>
      }
    </div>

    <div class="how-action">
      <luna-button variant="primary" size="md" routerLink="/signup">
        <span>Start with step 1</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
        </svg>
      </luna-button>
    </div>
  </luna-container>
</section>
