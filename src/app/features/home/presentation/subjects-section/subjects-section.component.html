<section class="subjects-section">
  <luna-container width="default">
    <div class="subjects-header">
      <h2 class="subjects-title">Follow your curiosity.</h2>
      <luna-button variant="secondary" size="sm" routerLink="/subjects">
        <span>Search subjects</span>
        <span aria-hidden="true">&rarr;</span>
      </luna-button>
    </div>

    <div class="subjects-grid">
      @for (subject of subjects; track subject.title) {
        <article 
          class="subject-card"
          [style.background-color]="subject.bgColor"
          [style.border-color]="subject.borderColor"
        >
          <div class="subject-card-body">
            <h3 class="subject-title">{{ subject.title }}</h3>
            <p class="subject-desc">{{ subject.description }}</p>
          </div>

          <div class="subject-footer">
            <div class="subject-icon" [style.color]="subject.iconColor">
              @switch (subject.iconType) {
                @case ('calc') {
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="16" height="20" x="4" y="2" rx="2"/>
                    <line x1="8" x2="16" y1="6" y2="6"/>
                    <line x1="16" x2="16" y1="14" y2="18"/>
                    <path d="M16 10h.01M12 10h.01M8 10h.01M12 14h.01M8 14h.01M12 18h.01M8 18h.01"/>
                  </svg>
                }
                @case ('flask') {
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/>
                    <path d="M8.5 2h7M7 16h10"/>
                  </svg>
                }
                @case ('chat') {
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
                  </svg>
                }
                @case ('globe') {
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <path d="M12 2a14.5 14.5 0 0 0 0 20M12 2a14.5 14.5 0 0 1 0 20M2 12h20"/>
                  </svg>
                }
                @case ('star') {
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
                  </svg>
                }
              }
            </div>

            <span class="subject-levels">
              <span>{{ subject.levels }}</span>
              <span aria-hidden="true">&rarr;</span>
            </span>
          </div>
        </article>
      }
    </div>
  </luna-container>
</section>
